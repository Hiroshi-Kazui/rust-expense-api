name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_test
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: expense_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_user -d expense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: sudo apt-get install -y libpq-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings
        env:
          DATABASE_URL: postgres://expense_user:expense_pass@localhost:5432/expense_test

      - name: Build (release)
        run: cargo build --release
        env:
          DATABASE_URL: postgres://expense_user:expense_pass@localhost:5432/expense_test

      - name: Run tests
        run: cargo test
        env:
          DATABASE_URL: postgres://expense_user:expense_pass@localhost:5432/expense_test
          JWT_SECRET: test-secret-key-for-ci-must-be-32chars
          JWT_EXPIRES_IN_HOURS: "24"
          UPLOAD_DIR: /tmp/uploads

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rust-expense-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
