services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_db
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://expense_user:expense_pass@db:5432/expense_db
      JWT_SECRET: ${JWT_SECRET:-please-set-JWT_SECRET-in-env}
      JWT_EXPIRES_IN_HOURS: "24"
      UPLOAD_DIR: /app/uploads
      RUST_LOG: info
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
