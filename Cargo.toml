[workspace]
members = [".", "frontend"]
resolver = "2"

[package]
name = "rust-expense-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-expense-api"
path = "src/main.rs"

[lib]
name = "rust_expense_api"
path = "src/lib.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2", features = ["postgres", "uuid", "chrono", "r2d2"] }
diesel-derive-enum = { version = "2", features = ["postgres"] }
r2d2 = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
diesel_migrations = "2"
dotenvy = "0.15"
futures = "0.3"
futures-util = "0.3"
mime = "0.3"
log = "0.4"
env_logger = "0.11"
thiserror = "1"

[dev-dependencies]
actix-rt = "2"
actix-http = "3"
serial_test = "3"
once_cell = "1"
